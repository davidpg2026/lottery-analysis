name: Update lottery data

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest results and update index.html
        run: node update.js

      - name: Commit any new draws
        run: |
          git config user.name  "lottery-updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No new draws today."
          else
            git commit -m "Update Illinois lottery results ($(date -u +%Y-%m-%d))"
            git push
          fi
