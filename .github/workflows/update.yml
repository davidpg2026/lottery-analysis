name: Update lottery data

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install curl_cffi
        run: pip install curl_cffi

      - name: Fetch latest results and update index.html
        run: python update.py

      - name: Commit any new draws
        run: |
          git config user.name  "lottery-updater"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No new draws today."
          else
            git commit -m "Update Illinois lottery results ($(date -u +%Y-%m-%d))"
            git push
          fi
